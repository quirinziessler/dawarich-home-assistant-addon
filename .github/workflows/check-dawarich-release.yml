name: Check and auto-update Dawarich release

on:
  schedule:
    - cron: "0 */6 * * *" # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get current and latest versions
        id: versions
        run: |
          echo "::group::Fetching version info"
          CURRENT=$(grep -m1 'freikin/dawarich:' dawarich/build.yaml | sed 's/.*freikin\/dawarich://')
          LATEST=$(curl -sf https://api.github.com/repos/Freika/dawarich/releases/latest | jq -r '.tag_name')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║  Dawarich Version Check              ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  Current:  $CURRENT"
          echo "║  Latest:   $LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "║  Status:   ✅ Up to date"
          else
            echo "║  Status:   🔄 Update available"
          fi
          echo "╚══════════════════════════════════════╝"

      # ── Gate: stop here if already current ──
      - name: Check if update needed
        if: steps.versions.outputs.current == steps.versions.outputs.latest
        run: echo "Nothing to do — already on the latest version."

      # ── Verify Docker image exists for both architectures ──
      - name: Verify Docker image availability
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        id: docker
        run: |
          LATEST="${{ steps.versions.outputs.latest }}"
          echo "Checking Docker Hub for freikin/dawarich:${LATEST}..."
          echo ""

          MISSING=""
          TAG_INFO=$(curl -sf "https://hub.docker.com/v2/repositories/freikin/dawarich/tags/${LATEST}" || echo "{}")

          for ARCH in amd64 arm64; do
            STATUS=$(echo "$TAG_INFO" \
              | jq -r --arg arch "$ARCH" '.images[] | select(.architecture == $arch) | .architecture' 2>/dev/null)
            if [ -n "$STATUS" ]; then
              echo "  ✅ $ARCH — available"
            else
              echo "  ❌ $ARCH — NOT FOUND"
              MISSING="${MISSING} ${ARCH}"
            fi
          done

          echo ""
          if [ -n "$MISSING" ]; then
            echo "::warning::Docker image missing architectures:${MISSING}"
          else
            echo "All required architectures present."
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      # ── Collect release notes (all versions between current and latest) ──
      - name: Collect release notes
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.docker.outputs.missing == ''
        id: release
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
        run: |
          echo "Fetching all releases between ${CURRENT} and latest..."
          RELEASES=$(curl -sf "https://api.github.com/repos/Freika/dawarich/releases?per_page=50")

          NEWER=$(echo "$RELEASES" | jq --arg current "$CURRENT" '
            [ .[] | select(.prerelease == false and .draft == false) ]
            | sort_by(.published_at) | reverse
            | [foreach .[] as $r (
                {stop: false, items: []};
                if .stop then . else
                  if $r.tag_name == $current then .stop = true
                  else .items += [$r]
                  end
                end;
                .items
              )]
            | last
          ')

          NOTES=$(echo "$NEWER" | jq -r '.[] | "### " + .tag_name + "\n" + .body + "\n"')
          VERSIONS=$(echo "$NEWER" | jq -r '.[].tag_name')
          COUNT=$(echo "$NEWER" | jq 'length')

          echo ""
          echo "Found ${COUNT} release(s) to include:"
          echo "$VERSIONS" | while read -r v; do [ -n "$v" ] && echo "  - $v"; done
          echo ""

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      # ── Update version files ──
      - name: Update version files
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.docker.outputs.missing == ''
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          echo "Updating version references..."

          # build.yaml — base image tag
          sed -i "s|freikin/dawarich:${CURRENT}|freikin/dawarich:${LATEST}|g" dawarich/build.yaml
          echo "  ✓ build.yaml → freikin/dawarich:${LATEST}"

          # config.yaml — addon version
          OLD_VERSION=$(grep '^version:' dawarich/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          NEW_VERSION="${LATEST}-1"
          sed -i "s|version: \"${OLD_VERSION}\"|version: \"${NEW_VERSION}\"|" dawarich/config.yaml
          echo "  ✓ config.yaml → ${NEW_VERSION}"

          # CHANGELOG.md — prepend new entry
          CHANGELOG_ENTRY="## ${NEW_VERSION}\n\n- Upgrade base image to Dawarich [${LATEST}](https://github.com/Freika/dawarich/releases/tag/${LATEST})\n- See [upstream release notes](https://github.com/Freika/dawarich/releases/tag/${LATEST}) for full details\n"
          sed -i "s|^# Changelog$|# Changelog\n\n${CHANGELOG_ENTRY}|" dawarich/CHANGELOG.md
          echo "  ✓ CHANGELOG.md → new entry for ${NEW_VERSION}"

          # README.md — update version line
          sed -i "s|^\*\*Current Dawarich version: .*|\*\*Current Dawarich version: ${LATEST}\*\* ([release notes](https://github.com/Freika/dawarich/releases/tag/${LATEST}))|" README.md
          echo "  ✓ README.md → version badge updated"

      # ── Commit, push to main and publish release ──
      - name: Publish update to main
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.docker.outputs.missing == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_COUNT: ${{ steps.release.outputs.count }}
        run: |
          NEW_VERSION="${LATEST}-1"
          echo "Publishing release ${NEW_VERSION}..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add dawarich/build.yaml dawarich/config.yaml dawarich/CHANGELOG.md README.md
          git commit -m "Auto-bump Dawarich to ${LATEST} (${NEW_VERSION})"
          git push origin main

          # Create GitHub Release with upstream notes so git tag and release exist immediately
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --target "main" \
            --notes "$(cat <<EOF
          ## Dawarich $LATEST (Add-on $NEW_VERSION)

          Automated update: upgraded base image from **$CURRENT** to **$LATEST** ($RELEASE_COUNT release(s)).

          Home Assistant will detect this update automatically if auto-update is enabled.

          <details>
          <summary>Upstream Release Notes ($RELEASE_COUNT release(s))</summary>

          $RELEASE_NOTES

          </details>

          ---
          Upstream release: https://github.com/Freika/dawarich/releases/tag/$LATEST
          EOF
          )"

          echo "✅ Successfully updated to ${NEW_VERSION} and published release!"
